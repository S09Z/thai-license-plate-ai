[project]
name = "thai-license-plate-ai"
version = "0.1.0"
description = "Detect Thai vehicle license plates and recognize plate number and province."
authors = [
    {name = "Ittichai Boonyarakthunya",email = "i.boonyarakthunya@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.5.0,<3.0.0)",
    "python-multipart (>=0.0.12,<0.0.13)",
    "ultralytics (>=8.2.0,<8.3.0)",
    "opencv-python-headless (>=4.10.0,<4.11.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "pillow (>=10.2.0,<11.0.0)",
]


[tool.poetry]
# This is a deployable application, not a distributable library.
package-mode = false


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pydocstyle (Google), pyupgrade, bugbear.
select = ["E", "F", "I", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests and package markers do not require docstrings.
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]


[tool.black]
line-length = 88
target-version = ["py312"]


[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Ultralytics ships no type information.
module = ["ultralytics.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
