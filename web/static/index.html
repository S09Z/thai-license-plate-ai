<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thai License Plate Recognition</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Thai License Plate Recognition</h1>
    <p class="lede">
      Upload a photo to detect plates, read the number and resolve the province.
    </p>

    <div id="mode-switch" role="group" aria-label="Input source">
      <button type="button" id="upload-mode-button" aria-pressed="true">Upload plate</button>
      <button type="button" id="camera-plate-button" aria-pressed="false">Live camera · plate</button>
      <button type="button" id="camera-face-button" aria-pressed="false">Live camera · face</button>
    </div>

    <form id="upload-form">
      <input type="file" id="file-input" accept="image/png, image/jpeg" required>
      <button type="submit" id="submit-button">Recognize</button>
    </form>

    <div id="camera-panel" hidden>
      <button type="button" id="start-camera-button">Start camera</button>
      <button type="button" id="stop-camera-button" hidden>Stop</button>
      <label class="toggle" id="face-controls" for="face-mode" hidden>
        Faces
        <select id="face-mode">
          <option value="boxes" selected>Face boxes</option>
          <option value="features">Facial features</option>
          <option value="mesh">Face mesh</option>
          <option value="attributes">Expression &amp; gender</option>
        </select>
      </label>
      <div id="camera-stage" hidden>
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="tracking-overlay"></canvas>
        <canvas id="face-overlay"></canvas>
      </div>
    </div>

    <p id="status" class="status" hidden></p>

    <div id="preview-panel" hidden>
      <canvas id="preview"></canvas>
    </div>

    <table id="results" hidden>
      <thead>
        <tr>
          <th><span class="visually-hidden">Box</span></th>
          <th>Crop</th>
          <th>Plate number</th>
          <th>Confidence</th>
          <th>Province</th>
          <th>Confidence</th>
          <th>Province read as</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
